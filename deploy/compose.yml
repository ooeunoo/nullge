name: nullge
services:
  web:
    image: ghcr.io/ooeunoo/nullge-web:${IMAGE_TAG:?IMAGE_TAG required}
    restart: unless-stopped
    environment:
      PORT: '3000'
      NODE_ENV: production
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    labels:
      nullge.slug: nullge
      nullge.role: web
